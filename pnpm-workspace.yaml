packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks dependency build scripts unless explicitly allowed.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  sharp: true
  unrs-resolver: true

# eslint-config-next resolves its plugins from the app directory.
publicHoistPattern:
  - "*eslint*"
  - "@next/eslint-plugin-next"
