name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit and audit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres schema is in sync with prisma/schema.prisma
        run: node apps/web/scripts/prisma-schema.mjs check
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit and integration tests with coverage thresholds
        run: pnpm test:coverage
      - name: Adversarial audit suite (AUD-01 to AUD-05)
        run: pnpm test:audit

  e2e:
    name: End-to-end (Playwright, production build, mock devnet)
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @belflow/web exec playwright install --with-deps chromium
      - run: pnpm --filter @belflow/web db:generate
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
